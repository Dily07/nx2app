name: Build Dead Cells IPA (NX2Apple/nxnative)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "Link diretto allo zip contenente i file di Dead Cells (.nsp, update, DLC) e il file prod.keys"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-26 # Apple Silicon runner richiesto per Metal 4 e la compilazione degli shader

    steps:
      - name: Checkout core engine (nxnative)
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze di sistema
        run: |
          brew install xcodegen zstd glslang

      - name: Installa .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Installa dipendenze Python
        run: |
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Compatibilità assembler Apple per dav1d
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("dm/third_party/dav1d/config/config.h")
          text = config.read_text()
          replacements = {
              "#define HAVE_AS_ARCHEXT_DOTPROD_DIRECTIVE 1":
                  "#define HAVE_AS_ARCHEXT_DOTPROD_DIRECTIVE 0",
              "#define HAVE_AS_ARCHEXT_I8MM_DIRECTIVE 1":
                  "#define HAVE_AS_ARCHEXT_I8MM_DIRECTIVE 0",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected dav1d setting not found: {old}")
              text = text.replace(old, new, 1)
          config.write_text(text)
          PY

      - name: Scarica ed estrai gli asset di gioco
        run: |
          mkdir -p game_assets
          echo "Scaricando i file..."
          curl -L "${{ github.event.inputs.game_url }}" -o game.zip
          echo "Estraendo l'archivio..."
          unzip -q game.zip -d game_assets/

          # build_ipa_from_nsp.py scans only the immediate contents of its
          # input directory. Archives commonly wrap the packages in a folder,
          # so flatten nested NSP/NSZ/XCI/XCZ files into the staging root.
          while IFS= read -r -d '' package; do
            relative_path="${package#game_assets/}"
            flat_name="${relative_path//\//_}"
            cp "$package" "game_assets/$flat_name"
          done < <(
            find game_assets -mindepth 2 -type f \
              \( -iname '*.nsp' -o -iname '*.nsz' -o -iname '*.xci' -o -iname '*.xcz' \) \
              -print0
          )
          
      - name: Build dell'IPA
        run: |
          # Individua il percorso esatto del prod.keys
          KEYS_PATH=$(find game_assets -name "prod.keys" | head -n 1)
          if [ -z "$KEYS_PATH" ]; then
            echo "Errore: file prod.keys non trovato nello zip!"
            exit 1
          fi
          
          echo "Avviando la build pipeline per Dead Cells (ID: 0100646009FBE000)..."
          python3 scripts/build_ipa_from_nsp.py game_assets -k "$KEYS_PATH" --app-name "Dead Cells"
          
      - name: Upload Artifact IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dead-Cells-IPA
          path: "*.ipa"
          retention-days: 3
